services:
  db:
    image: postgres:16-alpine
    container_name: campusos_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campusos_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campusos_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusos_backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/campusos_ai
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-32-bytes-minimum}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
    networks:
      - campusos_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusos_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_NAME=CampusOS AI
      - NEXT_PUBLIC_CAMPUS_NAME=Chitkara Institute of Technology
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - campusos_network

volumes:
  postgres_data:
    driver: local

networks:
  campusos_network:
    driver: bridge
